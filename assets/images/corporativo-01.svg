<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema Financiero Inteligente</title>
  <desc id="desc">Ilustracion corporativa abstracta con edificios y conexiones de datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1E39"/>
      <stop offset="1" stop-color="#1D4A82"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7CD4FF"/>
      <stop offset="1" stop-color="#FF8A3C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.25">
    <circle cx="250" cy="190" r="130" fill="#2D6CB4"/>
    <circle cx="1270" cy="170" r="180" fill="#12355F"/>
    <circle cx="1090" cy="730" r="210" fill="#0F2C52"/>
  </g>
  <g opacity="0.9">
    <rect x="180" y="290" width="180" height="420" rx="18" fill="#102A4C"/>
    <rect x="390" y="220" width="210" height="490" rx="18" fill="#14345E"/>
    <rect x="630" y="160" width="240" height="550" rx="18" fill="#19406F"/>
    <rect x="905" y="250" width="210" height="460" rx="18" fill="#173963"/>
    <rect x="1140" y="320" width="170" height="390" rx="18" fill="#123058"/>
  </g>
  <g stroke="url(#line)" stroke-width="4" filter="url(#glow)">
    <path d="M270 620C460 570 520 510 740 470C890 445 960 425 1220 370"/>
    <path d="M260 500C420 470 500 380 700 350C930 315 1030 260 1230 230"/>
    <path d="M260 690C430 650 540 630 760 610C970 590 1060 560 1230 510"/>
  </g>
  <g fill="#EAF6FF" opacity="0.92">
    <circle cx="270" cy="620" r="10"/>
    <circle cx="740" cy="470" r="10"/>
    <circle cx="1220" cy="370" r="10"/>
    <circle cx="700" cy="350" r="10"/>
    <circle cx="1230" cy="230" r="10"/>
    <circle cx="760" cy="610" r="10"/>
    <circle cx="1230" cy="510" r="10"/>
  </g>
  <text x="180" y="812" fill="#F4FAFF" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Ecosistema Financiero Inteligente</text>
  <text x="180" y="850" fill="#B8D2EE" font-size="28" font-family="Segoe UI, Arial, sans-serif">Analitica y operaciones conectadas para decisiones ejecutivas.</text>
</svg>
