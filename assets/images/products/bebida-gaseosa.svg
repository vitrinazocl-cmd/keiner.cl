<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBebida" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#31103F" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="60%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#180202" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glowCola" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgBebida)" />
  <circle cx="300" cy="200" r="150" fill="#EF4444" opacity="0.15" filter="url(#glowCola)" />

  <!-- Effervescent Bubbles in background -->
  <circle cx="230" cy="280" r="6" fill="#FCA5A5" opacity="0.4" />
  <circle cx="245" cy="220" r="4" fill="#FCA5A5" opacity="0.5" />
  <circle cx="360" cy="250" r="8" fill="#FCA5A5" opacity="0.3" />
  <circle cx="370" cy="180" r="5" fill="#FCA5A5" opacity="0.4" />
  <circle cx="290" cy="120" r="4" fill="#FFFFFF" opacity="0.6" />
  <circle cx="310" cy="100" r="3" fill="#FFFFFF" opacity="0.7" />

  <!-- Bottle Shadow -->
  <ellipse cx="300" cy="340" rx="50" ry="10" fill="#000000" opacity="0.6" filter="url(#glowCola)" />

  <!-- Cola Bottle 1.5L -->
  <path d="M 278 115 C 278 115, 275 140, 265 170 C 255 200, 252 230, 255 315 C 255 330, 270 335, 300 335 C 330 335, 345 330, 345 315 C 348 230, 345 200, 335 170 C 325 140, 322 115, 322 115 Z" fill="url(#liquidGrad)" stroke="#EF4444" stroke-width="2" />
  <!-- Glass Reflection -->
  <path d="M 265 175 C 260 200, 258 230, 260 310" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.3" fill="none" />

  <!-- Bottle Cap -->
  <rect x="282" y="92" width="36" height="23" rx="3" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Bottle Label -->
  <path d="M 254 210 L 346 210 L 346 275 L 254 275 Z" fill="url(#labelGrad)" />
  <path d="M 254 210 Q 300 220, 346 210 L 346 220 Q 300 230, 254 220 Z" fill="#FFFFFF" opacity="0.2" />

  <text x="300" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SODA FRESH</text>
  <text x="300" y="258" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FEF08A" text-anchor="middle">SABOR COLA 1.5L</text>

  <!-- Ice Cubes Graphic -->
  <g transform="translate(140, 220)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#E0F2FE" opacity="0.25" stroke="#BAE6FD" stroke-width="2" />
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🧊</text>
  </g>
  <g transform="translate(460, 240)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#E0F2FE" opacity="0.25" stroke="#BAE6FD" stroke-width="2" />
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🥤</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#EF4444" stroke-width="1.5" />
  <text x="100" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FCA5A5" text-anchor="middle">🥤 BEBIDAS &amp; PACKS</text>
</svg>
