<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808" />
      <stop offset="50%" stop-color="#3B0707" />
      <stop offset="100%" stop-color="#581C1C" />
    </linearGradient>
    <linearGradient id="burgerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glowMeat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgMeat)" />
  <circle cx="300" cy="200" r="140" fill="#EF4444" opacity="0.12" filter="url(#glowMeat)" />

  <!-- Cold Chain Snowflake Graphic -->
  <g opacity="0.2" transform="translate(300, 200)">
    <path d="M 0 -100 L 0 100 M -100 0 L 100 0 M -70 -70 L 70 70 M -70 70 L 70 -70" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Box Pack Base -->
  <g transform="translate(180, 130)">
    <!-- Main Box -->
    <rect x="0" y="0" width="240" height="170" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" filter="url(#glowMeat)" />
    <rect x="10" y="10" width="220" height="150" rx="10" fill="url(#burgerGrad)" />

    <!-- Label Seal -->
    <rect x="25" y="25" width="170" height="120" rx="8" fill="#FFFFFF" opacity="0.95" />
    <text x="110" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#991B1B" text-anchor="middle">CARNES SAN JOSÉ</text>
    <text x="110" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="900" fill="#111827" text-anchor="middle">HAMBURGUESAS</text>
    <text x="110" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">100% VACUNO 100g</text>

    <rect x="40" y="102" width="140" height="22" rx="11" fill="#0284C7" />
    <text x="110" y="117" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CAJA 40 UNIDADES</text>
  </g>

  <!-- Floating Cold Badge Icons -->
  <g transform="translate(110, 180)">
    <circle cx="0" cy="0" r="30" fill="#0284C7" opacity="0.25" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">❄️</text>
  </g>
  <g transform="translate(490, 220)">
    <circle cx="0" cy="0" r="30" fill="#991B1B" opacity="0.25" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🥩</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="180" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="110" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#7DD3FC" text-anchor="middle">❄️ CADENA DE FRÍO 100%</text>
</svg>
