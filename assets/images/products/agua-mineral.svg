<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="waterBottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <filter id="glowWater" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgWater)" />
  <circle cx="300" cy="200" r="140" fill="#38BDF8" opacity="0.15" filter="url(#glowWater)" />

  <!-- Mountain Silhouette in Background -->
  <path d="M 100 320 L 220 200 L 300 260 L 420 160 L 520 320 Z" fill="#0369A1" opacity="0.4" />

  <!-- Water Bottle 500ml -->
  <g transform="translate(255, 90)">
    <!-- Blue Cap -->
    <rect x="30" y="10" width="30" height="15" rx="3" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Bottle Body -->
    <path d="M 30 25 L 60 25 L 65 60 C 80 80, 80 100, 80 230 C 80 240, 70 245, 45 245 C 20 245, 10 240, 10 230 C 10 100, 10 80, 25 60 Z" fill="url(#waterBottleGrad)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" />

    <!-- Label -->
    <rect x="12" y="100" width="66" height="90" rx="4" fill="#0284C7" opacity="0.9" />
    <text x="45" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">MANANTIAL</text>
    <text x="45" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#7DD3FC" text-anchor="middle">PURA VIDA</text>

    <!-- Water Drop -->
    <text x="45" y="160" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">💧</text>
    <text x="45" y="180" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">500 ML</text>
  </g>

  <!-- Side Floating Elements -->
  <g transform="translate(130, 220)">
    <circle cx="0" cy="0" r="28" fill="#38BDF8" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🏔️</text>
  </g>
  <g transform="translate(470, 230)">
    <circle cx="0" cy="0" r="28" fill="#38BDF8" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">💧</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="100" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#7DD3FC" text-anchor="middle">💧 BEBIDAS &amp; AGUAS</text>
</svg>
