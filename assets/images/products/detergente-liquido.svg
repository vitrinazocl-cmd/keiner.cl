<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021329" />
      <stop offset="50%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <linearGradient id="bottleClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="glowBubbles" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgClean)" />
  <circle cx="300" cy="200" r="140" fill="#38BDF8" opacity="0.15" filter="url(#glowBubbles)" />

  <!-- Foam Bubbles -->
  <circle cx="160" cy="140" r="18" fill="#E0F2FE" opacity="0.4" />
  <circle cx="180" cy="120" r="10" fill="#E0F2FE" opacity="0.5" />
  <circle cx="430" cy="150" r="22" fill="#E0F2FE" opacity="0.3" />
  <circle cx="450" cy="180" r="14" fill="#E0F2FE" opacity="0.4" />

  <!-- Detergent Jug 3L -->
  <g transform="translate(240, 100)">
    <!-- Handle -->
    <path d="M 20 60 C 20 20, 70 20, 70 60 L 70 140 C 70 160, 20 160, 20 140 Z" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2" />
    <!-- Jug Body -->
    <path d="M 40 40 L 110 40 Q 130 50, 135 90 L 140 210 Q 140 230, 120 230 L 40 230 Q 20 230, 20 210 L 20 90 Q 25 50, 40 40 Z" fill="url(#bottleClean)" stroke="#93C5FD" stroke-width="2" />

    <!-- Cap -->
    <rect x="55" y="15" width="40" height="25" rx="5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Label -->
    <rect x="32" y="90" width="96" height="110" rx="8" fill="#FFFFFF" />
    <text x="80" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" fill="#1E40AF" text-anchor="middle">LIMPIOMAX</text>
    <text x="80" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#16A34A" text-anchor="middle">CONCENTRADO</text>
    <text x="80" y="148" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="middle">DETERGENTE 3L</text>
    <text x="80" y="180" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">ULTRA DESINFECTANTE</text>
  </g>

  <!-- Sparkle Graphic -->
  <g transform="translate(130, 220)">
    <circle cx="0" cy="0" r="28" fill="#38BDF8" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🧼</text>
  </g>
  <g transform="translate(470, 240)">
    <circle cx="0" cy="0" r="28" fill="#16A34A" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">✨</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="170" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="105" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">🧼 LIMPIEZA &amp; HIGIENE</text>
</svg>
