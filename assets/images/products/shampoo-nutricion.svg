<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPersonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2C" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="shampooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="60%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <filter id="glowPersonal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgPersonal)" />
  <circle cx="300" cy="200" r="140" fill="#2DD4BF" opacity="0.15" filter="url(#glowPersonal)" />

  <!-- Soft Water Bubbles -->
  <circle cx="150" cy="160" r="14" fill="#CCFBF1" opacity="0.3" />
  <circle cx="450" cy="180" r="18" fill="#CCFBF1" opacity="0.25" />

  <!-- Shampoo Bottle 400ml -->
  <g transform="translate(250, 90)">
    <!-- Dispenser Cap -->
    <rect x="35" y="10" width="30" height="15" rx="3" fill="#115E59" stroke="#99F6E4" stroke-width="1.5" />
    <path d="M 40 25 L 60 25 L 60 40 L 40 40 Z" fill="#0F766E" />

    <!-- Sleek Bottle Body -->
    <path d="M 35 40 L 65 40 Q 90 55, 95 100 L 90 230 Q 90 245, 75 245 L 25 245 Q 10 245, 10 230 L 5 100 Q 10 55, 35 40 Z" fill="url(#shampooGrad)" stroke="#99F6E4" stroke-width="2" />

    <!-- Label -->
    <rect x="18" y="90" width="64" height="120" rx="6" fill="#FFFFFF" opacity="0.95" />
    <text x="50" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#0F766E" text-anchor="middle">BIOVITAL</text>
    <text x="50" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#0D9488" text-anchor="middle">SHAMPOO</text>

    <!-- Leaf icon -->
    <text x="50" y="155" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🌿</text>

    <text x="50" y="178" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#0F766E" text-anchor="middle">NUTRICIÓN INTENSA</text>
    <text x="50" y="194" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">400 ML</text>
  </g>

  <!-- Side Badges -->
  <g transform="translate(130, 220)">
    <circle cx="0" cy="0" r="28" fill="#2DD4BF" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🧴</text>
  </g>
  <g transform="translate(470, 230)">
    <circle cx="0" cy="0" r="28" fill="#2DD4BF" opacity="0.2" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">💧</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="170" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#2DD4BF" stroke-width="1.5" />
  <text x="105" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#99F6E4" text-anchor="middle">🧴 CUIDADO PERSONAL</text>
</svg>
