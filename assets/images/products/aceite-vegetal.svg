<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="50%" stop-color="#3a2e1c" />
      <stop offset="100%" stop-color="#5c441b" />
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="160" fill="#FFB300" opacity="0.12" filter="url(#glow)" />
  <path d="M0 320 Q 150 280, 300 320 T 600 300 L 600 400 L 0 400 Z" fill="#14100c" opacity="0.6" />

  <!-- Sunflowers / Grain graphics background -->
  <g opacity="0.15">
    <circle cx="120" cy="100" r="40" stroke="#FFD700" stroke-width="2" fill="none" />
    <circle cx="480" cy="120" r="55" stroke="#FFD700" stroke-width="2" fill="none" />
  </g>

  <!-- Bottle shadow -->
  <ellipse cx="300" cy="335" rx="55" ry="12" fill="#000000" opacity="0.5" filter="url(#glow)" />

  <!-- Oil Bottle Body -->
  <path d="M 270 120 L 330 120 L 335 150 L 345 190 L 345 310 Q 345 330, 325 330 L 275 330 Q 255 330, 255 310 L 255 190 L 265 150 Z" fill="url(#oilGrad)" stroke="#FFE082" stroke-width="3" />
  <!-- Glass Shine -->
  <path d="M 268 155 L 275 155 L 275 315 L 268 315 Z" fill="#FFFFFF" opacity="0.35" />

  <!-- Bottle Cap -->
  <rect x="275" y="95" width="50" height="25" rx="4" fill="url(#capGrad)" stroke="#FFFFFF" stroke-width="1.5" />
  <rect x="278" y="90" width="44" height="6" rx="2" fill="#FF8A80" />

  <!-- Label on Bottle -->
  <rect x="260" y="200" width="80" height="90" rx="6" fill="#FFFFFF" opacity="0.95" />
  <rect x="265" y="205" width="70" height="18" fill="#1E3A8A" rx="3" />
  <text x="300" y="218" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ORO DEL CAMPO</text>
  <text x="300" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706" text-anchor="middle">ACEITE</text>
  <text x="300" y="254" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#B45309" text-anchor="middle">VEGETAL</text>
  <!-- Oil Drop Icon on Label -->
  <path d="M 300 264 Q 294 274, 300 279 Q 306 274, 300 264 Z" fill="#F59E0B" />
  <text x="300" y="286" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4B5563" text-anchor="middle">1 LITRO • NETO</text>

  <!-- Floating Elements -->
  <g transform="translate(140, 180)">
    <circle cx="0" cy="0" r="28" fill="#FFB300" opacity="0.2" />
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">🌻</text>
  </g>
  <g transform="translate(460, 220)">
    <circle cx="0" cy="0" r="28" fill="#FFB300" opacity="0.2" />
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">🌾</text>
  </g>

  <!-- Product Badge Banner -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#FFD700" stroke-width="1.5" />
  <text x="100" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFD700" text-anchor="middle">🌾 ABARROTES B2B</text>
</svg>
