# Nginx hardened config for KEINER.CL
# Replace values: keiner.cl, www.keiner.cl, certificate paths, and upstream port if needed.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
  listen 80;
  listen [::]:80;
  server_name keiner.cl www.keiner.cl;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name keiner.cl www.keiner.cl;

  ssl_certificate /etc/letsencrypt/live/keiner.cl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/keiner.cl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # OCSP stapling (configure resolver according to your environment).
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

  client_max_body_size 1m;
  keepalive_timeout 30;
  server_tokens off;

  # Mitigate abusive API traffic.
  location /api/ {
    limit_req zone=api_limit burst=15 nodelay;
    limit_conn conn_limit 20;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
  }

  # Block hidden files and VCS metadata.
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }
}
