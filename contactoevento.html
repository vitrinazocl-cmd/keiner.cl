<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto | KEINER</title>
  <meta name="robots" content="noindex, follow">
  
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0A0A0C;
      color: #F3F4F6;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 60px;
    }

    .form-wrapper {
      max-width: 680px;
      width: 100%;
      background: #141419;
      border: 1px solid #2D2D38;
      border-radius: 12px;
      padding: 36px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .form-header-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .form-header-logo img {
      height: 44px;
      width: auto;
    }

    /* Labels */
    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #E5E7EB;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .field-label .req {
      color: #E60000;
      margin-left: 2px;
    }

    /* 1. TIPO DE CONTACTO Radios */
    .radio-group-row {
      display: flex;
      gap: 32px;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      color: #D1D5DB;
    }

    .radio-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #E60000;
      cursor: pointer;
    }

    /* 2 Columns Grid */
    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 22px;
    }

    @media (max-width: 560px) {
      .row-2col {
        grid-template-columns: 1fr;
      }
    }

    .form-field {
      margin-bottom: 22px;
    }

    /* Inputs */
    .input-box {
      width: 100%;
      padding: 12px 14px;
      background: #1C1C24;
      border: 1px solid #333344;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      outline: none;
      border-color: #E60000;
      background: #22222E;
    }

    /* Celular input + Country select prefix */
    .phone-field-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-country-select {
      background: #1C1C24;
      border: 1px solid #333344;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: inherit;
      padding: 12px 6px;
      cursor: pointer;
      outline: none;
      min-width: 120px;
      max-width: 145px;
      transition: border-color 0.2s;
    }

    .phone-country-select:focus {
      border-color: #E60000;
    }

    .phone-country-select option {
      background: #1A1A24;
      color: #FFFFFF;
      padding: 6px;
    }

    .phone-field-group .input-box {
      flex: 1;
    }

    /* Custom Dropdown for CATEGORÍA INTERÉS */
    .dropdown-container {
      position: relative;
    }

    .select-btn {
      width: 100%;
      padding: 12px 14px;
      background: #1C1C24;
      border: 1px solid #333344;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
    }

    .select-btn:focus, .select-btn.active {
      outline: none;
      border-color: #E60000;
    }

    .arrow-icon {
      font-size: 0.75rem;
      color: #9CA3AF;
      transition: transform 0.2s;
    }

    .select-btn.active .arrow-icon {
      transform: rotate(180deg);
    }

    .checkbox-dropdown-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #1A1A24;
      border: 1px solid #333344;
      border-radius: 8px;
      padding: 14px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .checkbox-dropdown-panel.show {
      display: block;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-instruction {
      font-size: 0.72rem;
      font-weight: 800;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #2D2D38;
    }

    .checkbox-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: #E5E7EB;
    }

    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #E60000;
      cursor: pointer;
    }

    /* Submit Button */
    .submit-container {
      text-align: center;
      margin-top: 28px;
      margin-bottom: 16px;
    }

    .btn-submit {
      padding: 14px 44px;
      background: #E60000;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: #CC0000;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .mandatory-note {
      font-size: 0.8rem;
      color: #9CA3AF;
      font-weight: 500;
    }

    /* Success Box */
    .success-box {
      display: none;
      text-align: center;
      padding: 24px 0;
    }

    .ticket-code-badge {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFD700;
      font-family: monospace;
      margin: 18px 0;
      padding: 14px 24px;
      background: #1C1C24;
      border: 1px dashed #E60000;
      border-radius: 8px;
      display: inline-block;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid #4B5563;
      color: #D1D5DB;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn-reset:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <div class="form-header-logo">
      <a href="index.html">
        <img src="assets/images/logo-keiner-form-white.png" alt="keiner">
      </a>
    </div>

    <!-- FORM CONTAINER -->
    <div id="formContainer">
      <form id="feriaForm" novalidate>

        <!-- TIPO DE CONTACTO -->
        <div class="form-field">
          <label class="field-label">TIPO DE CONTACTO</label>
          <div class="radio-group-row">
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="PROVEEDOR"> PROVEEDOR
            </label>
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="CLIENTE" checked> CLIENTE
            </label>
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="OTRO"> OTRO
            </label>
          </div>
        </div>

        <!-- ROW 1: NOMBRE * | APELLIDO * -->
        <div class="row-2col">
          <div>
            <label for="fNombre" class="field-label">NOMBRE <span class="req">*</span></label>
            <input type="text" id="fNombre" name="nombre" class="input-box" required>
          </div>
          <div>
            <label for="fApellido" class="field-label">APELLIDO <span class="req">*</span></label>
            <input type="text" id="fApellido" name="apellido" class="input-box" required>
          </div>
        </div>

        <!-- ROW 2: CELULAR * | EMAIL -->
        <div class="row-2col">
          <div>
            <label for="fCelular" class="field-label">CELULAR <span class="req">*</span></label>
            <div class="phone-field-group">
              <select id="fPais" name="pais" class="phone-country-select" aria-label="Código de País">
                <option value="+56" selected>🇨🇱 +56 (Chile)</option>
                <option value="+54">🇦🇷 +54 (Argentina)</option>
                <option value="+51">🇵🇪 +51 (Perú)</option>
                <option value="+57">🇨🇴 +57 (Colombia)</option>
                <option value="+52">🇲🇽 +52 (México)</option>
                <option value="+1">🇺🇸 +1 (EE.UU.)</option>
                <option value="+1">🇨🇦 +1 (Canadá)</option>
                <option value="+34">🇪🇸 +34 (España)</option>
                <option value="+55">🇧🇷 +55 (Brasil)</option>
                <option value="+591">🇧🇴 +591 (Bolivia)</option>
                <option value="+593">🇪🇨 +593 (Ecuador)</option>
                <option value="+598">🇺🇾 +598 (Uruguay)</option>
                <option value="+595">🇵🇾 +595 (Paraguay)</option>
                <option value="+58">🇻🇪 +58 (Venezuela)</option>
                <option value="+507">🇵🇦 +507 (Panamá)</option>
                <option value="+506">🇨🇷 +506 (Costa Rica)</option>
                <option value="+1">🇩🇴 +1 (Rep. Dominicana)</option>
                <option value="+502">🇬🇹 +502 (Guatemala)</option>
                <option value="+504">🇭🇳 +504 (Honduras)</option>
                <option value="+503">🇸🇻 +503 (El Salvador)</option>
                <option value="+505">🇳🇮 +505 (Nicaragua)</option>
                <option value="+44">🇬🇧 +44 (Reino Unido)</option>
                <option value="+49">🇩🇪 +49 (Alemania)</option>
                <option value="+33">🇫🇷 +33 (Francia)</option>
                <option value="+39">🇮🇹 +39 (Italia)</option>
                <option value="+61">🇦🇺 +61 (Australia)</option>
                <option value="+86">🇨🇳 +86 (China)</option>
                <option value="+81">🇯🇵 +81 (Japón)</option>
                <option value="+82">🇰🇷 +82 (Corea del Sur)</option>
                <option value="+">🌐 + (Otro)</option>
              </select>
              <input type="tel" id="fCelular" name="celular" class="input-box" placeholder="9 1234 5678" required>
            </div>
          </div>
          <div>
            <label for="fEmail" class="field-label">EMAIL</label>
            <input type="email" id="fEmail" name="email" class="input-box" placeholder="correo@ejemplo.com">
          </div>
        </div>

        <!-- ROW 3: NOMBRE EMPRESA | CATEGORÍA INTERÉS (WITH SELECCIONE DROPDOWN) -->
        <div class="row-2col">
          <div>
            <label for="fEmpresa" class="field-label">NOMBRE EMPRESA</label>
            <input type="text" id="fEmpresa" name="empresa" class="input-box">
          </div>
          <div>
            <label class="field-label">CATEGORÍA INTERÉS</label>
            <div class="dropdown-container">
              <button type="button" class="select-btn" id="catSelectBtn">
                <span id="catSelectText">SELECCIONE</span>
                <span class="arrow-icon">▼</span>
              </button>
              
              <div class="checkbox-dropdown-panel" id="catDropdownPanel">
                <div class="panel-instruction">SE PUEDE SELECCIONAR MÁS DE UNO</div>
                <div class="checkbox-options">
                  <label class="check-item">
                    <input type="checkbox" name="categoria" value="PITA CHIPS"> PITA CHIPS
                  </label>
                  <label class="check-item">
                    <input type="checkbox" name="categoria" value="MIX CÓCTELES"> MIX CÓCTELES
                  </label>
                  <label class="check-item">
                    <input type="checkbox" name="categoria" value="COMIDA KOREANA"> COMIDA KOREANA
                  </label>
                  <label class="check-item">
                    <input type="checkbox" name="categoria" value="OTRO"> OTRO
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- COMENTARIOS -->
        <div class="form-field">
          <label for="fComentarios" class="field-label">COMENTARIOS</label>
          <textarea id="fComentarios" name="comentarios" class="input-box" rows="3" placeholder="TEXTO LIBRE"></textarea>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="submit-container">
          <button type="submit" class="btn-submit" id="btnSubmit">ENVIAR</button>
        </div>

        <div class="mandatory-note">* CAMPOS MANDATORIOS</div>

      </form>
    </div>

    <!-- SUCCESS SCREEN (EXACT MATCH TO PHOTO) -->
    <div class="success-box" id="successBox">
      <h2 style="font-size: 1.6rem; font-weight: 900; color: #FFFFFF; letter-spacing: 0.5px; margin-bottom: 10px;">REGISTRO EXITOSO</h2>
      <p style="color: #9CA3AF; font-size: 0.95rem; margin-bottom: 22px;">Código asignado para la ruleta:</p>
      
      <div style="background: #1A1A24; border: 1.5px dashed #E60000; border-radius: 12px; padding: 18px 36px; display: inline-block; margin-bottom: 28px;">
        <div id="displayTicketCode" style="font-size: 2.6rem; font-weight: 900; letter-spacing: 3px; color: #FFD700; font-family: monospace;">KNR-7668</div>
      </div>
      
      <div>
        <button type="button" class="btn-reset" id="btnReset" style="background: transparent; border: 1px solid #3A3A4A; border-radius: 8px; color: #E5E7EB; padding: 12px 28px; font-size: 0.9rem; font-weight: 600; cursor: pointer;">Registrar otro contacto</button>
      </div>
    </div>

    <div style="text-align: center; margin-top: 30px; margin-bottom: 10px;">
      <a href="admin-feria.html" style="color: #6B7280; font-size: 0.8rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;" onmouseover="this.style.color='#FF4D4D'" onmouseout="this.style.color='#6B7280'">
        🔒 Acceso Admin
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const catSelectBtn = document.getElementById('catSelectBtn');
      const catDropdownPanel = document.getElementById('catDropdownPanel');
      const catSelectText = document.getElementById('catSelectText');
      const checkboxes = document.querySelectorAll('input[name="categoria"]');

      // Toggle dropdown panel
      catSelectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = catDropdownPanel.classList.toggle('show');
        catSelectBtn.classList.toggle('active', isOpen);
      });

      // Update text on select
      checkboxes.forEach(chk => {
        chk.addEventListener('change', updateSelectText);
      });

      function updateSelectText() {
        const selected = Array.from(checkboxes).filter(c => c.checked).map(c => c.value);
        if (selected.length === 0) {
          catSelectText.textContent = 'SELECCIONE';
        } else if (selected.length === 1) {
          catSelectText.textContent = selected[0];
        } else {
          catSelectText.textContent = `${selected.length} SELECCIONADOS`;
        }
      }

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!catSelectBtn.contains(e.target) && !catDropdownPanel.contains(e.target)) {
          catDropdownPanel.classList.remove('show');
          catSelectBtn.classList.remove('active');
        }
      });

      // Form Submit
      const form = document.getElementById('feriaForm');
      const formContainer = document.getElementById('formContainer');
      const successBox = document.getElementById('successBox');
      const displayTicketCode = document.getElementById('displayTicketCode');
      const btnReset = document.getElementById('btnReset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        let nombre = document.getElementById('fNombre').value.trim();
        let apellido = document.getElementById('fApellido').value.trim();
        const celularNum = document.getElementById('fCelular').value.trim();

        if (nombre && !apellido && nombre.includes(' ')) {
          const parts = nombre.split(/\s+/);
          nombre = parts[0];
          apellido = parts.slice(1).join(' ');
        }

        if (!nombre || !celularNum) {
          alert('Por favor completa los campos obligatorios: NOMBRE y CELULAR.');
          return;
        }

        const paisCode = document.getElementById('fPais')?.value || '+56';
        const celular = `${paisCode} ${celularNum}`;
        const tipoContacto = form.querySelector('input[name="tipoContacto"]:checked')?.value || 'CLIENTE';
        const email = document.getElementById('fEmail').value.trim();
        const empresa = document.getElementById('fEmpresa').value.trim();
        const comentarios = document.getElementById('fComentarios').value.trim();

        const catEls = form.querySelectorAll('input[name="categoria"]:checked');
        const categorias = Array.from(catEls).map(el => el.value);

        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const ticketCode = `KNR-${randomNum}`;

        const leadData = {
          id: Date.now().toString(),
          ticketCode: ticketCode,
          timestamp: new Date().toISOString(),
          fechaLectura: new Date().toLocaleString('es-CL'),
          tipoContacto: tipoContacto,
          nombre: nombre,
          apellido: apellido,
          celular: celular,
          email: email,
          empresa: empresa,
          categorias: categorias.length > 0 ? categorias.join(', ') : 'Ninguna',
          comentarios: comentarios
        };

        try {
          const existing = JSON.parse(localStorage.getItem('keiner_feria_leads') || '[]');
          existing.unshift(leadData);
          localStorage.setItem('keiner_feria_leads', JSON.stringify(existing));
        } catch (err) {
          console.error('Error guardando localmente:', err);
        }

        try {
          const res = await fetch('/api/feria-lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(leadData)
          });
          if (res.ok) {
            const data = await res.json();
            if (data.ok && data.ticketCode) {
              leadData.ticketCode = data.ticketCode;
              displayTicketCode.textContent = data.ticketCode;
            }
            if (data.duplicate && data.message) {
              alert(data.message);
            }
          }
        } catch (err) {
          console.warn('Servidor offline:', err);
        }

        // FormSubmit Dual Email Dispatch Backup (contacto@keiner.cl & domingo@keiner.cl)
        try {
          fetch('https://formsubmit.co/ajax/contacto@keiner.cl', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              _subject: `[NUEVO LEAD FERIA] Ticket ${ticketCode} - ${nombre} ${apellido}`,
              _cc: 'domingo@keiner.cl',
              _replyto: email || 'contacto@keiner.cl',
              Ticket: ticketCode,
              Perfil: tipoContacto,
              Nombre: `${nombre} ${apellido}`,
              Celular: celular,
              Email: email || 'No informado',
              Empresa: empresa || 'No informada',
              Categorias: categorias.length > 0 ? categorias.join(', ') : 'Ninguna',
              Comentarios: comentarios || 'Sin comentarios'
            })
          }).catch(err => console.warn('FormSubmit backup:', err));
        } catch(err) {}

        displayTicketCode.textContent = ticketCode;
        formContainer.style.display = 'none';
        successBox.style.display = 'block';
      });

      btnReset.addEventListener('click', () => {
        form.reset();
        updateSelectText();
        successBox.style.display = 'none';
        formContainer.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
