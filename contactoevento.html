<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto | KEINER</title>
  <meta name="robots" content="noindex, follow">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0A0A0C;
      color: #F3F4F6;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px;
    }

    .form-wrapper {
      max-width: 640px;
      width: 100%;
      background: #141419;
      border: 1px solid #2A2A35;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .form-header-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .form-header-logo img {
      height: 42px;
      width: auto;
    }

    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #E5E7EB;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .field-label .req {
      color: #E60000;
    }

    .field-label .subnote {
      font-size: 0.72rem;
      color: #9CA3AF;
      font-weight: 500;
      text-transform: uppercase;
      display: block;
      margin-top: 2px;
    }

    /* Radios row */
    .radio-group-row {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      color: #D1D5DB;
    }

    .radio-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #E60000;
      cursor: pointer;
    }

    /* 2 columns layout */
    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 540px) {
      .row-2col {
        grid-template-columns: 1fr;
      }
    }

    .form-field {
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      background: #1C1C24;
      border: 1px solid #2D2D38;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    .input-box:focus {
      outline: none;
      border-color: #E60000;
      background: #22222E;
    }

    /* Celular input with prefix */
    .phone-input-wrap {
      display: flex;
      align-items: center;
      background: #1C1C24;
      border: 1px solid #2D2D38;
      border-radius: 6px;
      overflow: hidden;
    }

    .phone-prefix {
      padding: 12px 12px;
      background: #252532;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
      border-right: 1px solid #2D2D38;
      user-select: none;
    }

    .phone-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 14px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .phone-input-wrap input:focus {
      outline: none;
    }

    .phone-input-wrap:focus-within {
      border-color: #E60000;
    }

    /* Checkboxes list */
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      background: #1C1C24;
      border: 1px solid #2D2D38;
      border-radius: 6px;
      padding: 14px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: #D1D5DB;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #E60000;
      cursor: pointer;
    }

    .btn-submit {
      padding: 14px 40px;
      background: #E60000;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s ease;
      display: inline-block;
    }

    .btn-submit:hover {
      background: #CC0000;
    }

    .mandatory-note {
      font-size: 0.8rem;
      color: #9CA3AF;
      margin-top: 16px;
    }

    /* Clean Success Screen */
    .success-box {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .ticket-code-badge {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFD700;
      font-family: monospace;
      margin: 16px 0;
      padding: 12px 20px;
      background: #1C1C24;
      border: 1px dashed #E60000;
      border-radius: 8px;
      display: inline-block;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid #4B5563;
      color: #D1D5DB;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn-reset:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <div class="form-header-logo">
      <a href="index.html">
        <img src="assets/images/logo-keiner-header.png" alt="KEINER">
      </a>
    </div>

    <!-- FORM CONTAINER -->
    <div id="formContainer">
      <form id="feriaForm" novalidate>

        <!-- TIPO DE CONTACTO -->
        <div class="form-field">
          <label class="field-label">TIPO DE CONTACTO</label>
          <div class="radio-group-row">
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="PROVEEDOR"> PROVEEDOR
            </label>
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="CLIENTE" checked> CLIENTE
            </label>
            <label class="radio-item">
              <input type="radio" name="tipoContacto" value="OTRO"> OTRO
            </label>
          </div>
        </div>

        <!-- ROW 1: NOMBRE * | APELLIDO * -->
        <div class="row-2col">
          <div>
            <label for="fNombre" class="field-label">NOMBRE <span class="req">*</span></label>
            <input type="text" id="fNombre" name="nombre" class="input-box" required>
          </div>
          <div>
            <label for="fApellido" class="field-label">APELLIDO <span class="req">*</span></label>
            <input type="text" id="fApellido" name="apellido" class="input-box" required>
          </div>
        </div>

        <!-- ROW 2: CELULAR * | EMAIL -->
        <div class="row-2col">
          <div>
            <label for="fCelular" class="field-label">CELULAR <span class="req">*</span></label>
            <div class="phone-input-wrap">
              <span class="phone-prefix">+569</span>
              <input type="tel" id="fCelular" name="celular" placeholder="" required>
            </div>
          </div>
          <div>
            <label for="fEmail" class="field-label">EMAIL</label>
            <input type="email" id="fEmail" name="email" class="input-box">
          </div>
        </div>

        <!-- ROW 3: NOMBRE EMPRESA | CATEGORÍA INTERÉS -->
        <div class="row-2col">
          <div>
            <label for="fEmpresa" class="field-label">NOMBRE EMPRESA</label>
            <input type="text" id="fEmpresa" name="empresa" class="input-box">
          </div>
          <div>
            <label class="field-label">CATEGORÍA INTERÉS <span class="subnote">(SE PUEDE SELECCIONAR MÁS DE UNO)</span></label>
            <div class="checkbox-list">
              <label class="checkbox-item">
                <input type="checkbox" name="categoria" value="PITA CHIPS"> PITA CHIPS
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="categoria" value="MIX CÓCTELES"> MIX CÓCTELES
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="categoria" value="COMIDA KOREANA"> COMIDA KOREANA
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="categoria" value="OTRO"> OTRO
              </label>
            </div>
          </div>
        </div>

        <!-- COMENTARIOS -->
        <div class="form-field">
          <label for="fComentarios" class="field-label">COMENTARIOS</label>
          <textarea id="fComentarios" name="comentarios" class="input-box" rows="3" placeholder="TEXTO LIBRE"></textarea>
        </div>

        <!-- ENVIAR BUTTON -->
        <div style="margin-top: 24px;">
          <button type="submit" class="btn-submit" id="btnSubmit">ENVIAR</button>
        </div>

        <div class="mandatory-note">* CAMPOS MANDATORIOS</div>

      </form>
    </div>

    <!-- SUCCESS SCREEN -->
    <div class="success-box" id="successBox">
      <h2 style="font-size: 1.4rem; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;">REGISTRO EXITOSO</h2>
      <p style="color: #9CA3AF; font-size: 0.9rem;">Código asignado para la ruleta:</p>
      
      <div class="ticket-code-badge" id="displayTicketCode">KNR-9842</div>
      
      <div>
        <button type="button" class="btn-reset" id="btnReset">Registrar otro contacto</button>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('feriaForm');
      const formContainer = document.getElementById('formContainer');
      const successBox = document.getElementById('successBox');
      const displayTicketCode = document.getElementById('displayTicketCode');
      const btnReset = document.getElementById('btnReset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nombre = document.getElementById('fNombre').value.trim();
        const apellido = document.getElementById('fApellido').value.trim();
        const celularInput = document.getElementById('fCelular').value.trim();

        if (!nombre || !apellido || !celularInput) {
          alert('Por favor completa los campos obligatorios: NOMBRE, APELLIDO y CELULAR.');
          return;
        }

        const celular = celularInput.startsWith('+569') ? celularInput : `+569 ${celularInput}`;
        const tipoContacto = form.querySelector('input[name="tipoContacto"]:checked')?.value || 'CLIENTE';
        const email = document.getElementById('fEmail').value.trim();
        const empresa = document.getElementById('fEmpresa').value.trim();
        const comentarios = document.getElementById('fComentarios').value.trim();

        const catEls = form.querySelectorAll('input[name="categoria"]:checked');
        const categorias = Array.from(catEls).map(el => el.value);

        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const ticketCode = `KNR-${randomNum}`;

        const leadData = {
          id: Date.now().toString(),
          ticketCode: ticketCode,
          timestamp: new Date().toISOString(),
          fechaLectura: new Date().toLocaleString('es-CL'),
          tipoContacto: tipoContacto,
          nombre: nombre,
          apellido: apellido,
          celular: celular,
          email: email,
          empresa: empresa,
          categorias: categorias.length > 0 ? categorias.join(', ') : 'Ninguna',
          comentarios: comentarios
        };

        try {
          const existing = JSON.parse(localStorage.getItem('keiner_feria_leads') || '[]');
          existing.unshift(leadData);
          localStorage.setItem('keiner_feria_leads', JSON.stringify(existing));
        } catch (err) {
          console.error('Error guardando localmente:', err);
        }

        try {
          fetch('/api/feria-lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(leadData)
          }).catch(err => console.warn('Servidor offline, guardado en localStorage', err));
        } catch (err) {}

        displayTicketCode.textContent = ticketCode;
        formContainer.style.display = 'none';
        successBox.style.display = 'block';
      });

      btnReset.addEventListener('click', () => {
        form.reset();
        successBox.style.display = 'none';
        formContainer.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
